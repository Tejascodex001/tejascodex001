<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18"><animate attributeName="stop-color" values="#ff7a18;#af00ff;#2e9ef7;#ff7a18" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#2e9ef7"><animate attributeName="stop-color" values="#2e9ef7;#ff7a18;#af00ff;#2e9ef7" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <style>
      .t{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace}
      .h{font:800 54px 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:url(#flame);opacity:0;animation:up 1s .2s forwards}
      .s{fill:#a9b1d6;font-size:17px;opacity:0;animation:up 1s .7s forwards}
      .k{fill:#7aa2f7;font-size:14px;opacity:0;animation:up 1s 1.2s forwards}
      .n{fill:#2e9ef7;animation:pulse 3s ease-in-out infinite}
      .n:nth-of-type(2n){animation-delay:1s;fill:#ff7a18}
      .n:nth-of-type(3n){animation-delay:2s;fill:#af00ff}
      .e{stroke:#7aa2f7;stroke-opacity:.35;stroke-dasharray:4 6;animation:flow 6s linear infinite}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-100}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#grid)"/>
  <!-- neural-net motif -->
  <g transform="translate(640 40)">
    <g class="e">
      <path d="M20 30L110 20M20 30L110 90M20 30L110 160M20 100L110 20M20 100L110 90M20 100L110 160M20 170L110 90M20 170L110 160M110 20L200 60M110 90L200 60M110 90L200 130M110 160L200 130"/>
    </g>
    <circle class="n" cx="20" cy="30" r="7"/><circle class="n" cx="20" cy="100" r="7"/><circle class="n" cx="20" cy="170" r="7"/>
    <circle class="n" cx="110" cy="20" r="7"/><circle class="n" cx="110" cy="90" r="7"/><circle class="n" cx="110" cy="160" r="7"/>
    <circle class="n" cx="200" cy="60" r="9"/><circle class="n" cx="200" cy="130" r="9"/>
  </g>
  <text x="48" y="70" class="t k">~/tejas $ whoami<tspan class="cur">▋</tspan></text>
  <text x="44" y="135" class="h">Tejas Gowda S</text>
  <text x="48" y="172" class="t s">Junior AI Engineer @ Kenpath  ·  LLMs · Rust · Privacy</text>
  <text x="48" y="212" class="t k">building FLAME 🔥  ·  shipping Sanctum 🔒  ·  Bangalore, IN</text>
</svg>
